name: 规则讨论 / Rule discussion
description: 认为 V5.1 的某条规则、参数或证据解读有问题，或想提出新的规则/检验
title: "[rule] "
labels: ["rule-discussion"]
body:
  - type: markdown
    attributes:
      value: |
        **这是项目里要求最严的一类讨论**，因为规则改动会让历史回测与实时结果脱钩。请先读：
        - `references/08-backtest-evidence.md`（已经写明的局限，避免重复讨论）
        - `references/10-discipline-and-verification.md`（预登记、对照组、复现关卡）
        - CONTRIBUTING.md 第 3 类改动的全部要求

        **不接受**：没有对照组的"我回测发现这样更好"；看过结果再调的参数；在关注池（事后挑的票）上的单一回测。
  - type: input
    id: which
    attributes:
      label: 针对哪一条规则
      placeholder: "例：references/01 §6 卖出规则 7.4 持满 120 日到期"
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: 你的主张
      description: 一句话说清"现行规则是 X，我认为应该是 Y，因为 Z"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据与检验设计
      description: |
        数据范围与窗口；对照组（同票随机入场基线 + 没挑过的票）；判据是什么、**是否在看结果之前写下的**；扰动/稳健性；是否独立于现有 6 年窗口。
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 你认为的代价与反例
      description: 这个改动会让什么变差？有没有你自己发现的反例？
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我理解实时回测期内规则冻结，改动只会进入新版本、重计验证期
          required: true
        - label: 我没有贴真实持仓、账号或密钥
          required: true
