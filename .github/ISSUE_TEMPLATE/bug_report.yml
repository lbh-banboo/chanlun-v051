name: 缺陷报告 / Bug report
description: 脚本出错、输出不对、文档与代码不一致
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告。**请不要贴行情数据、账本、持仓、API 密钥**——这些是你的隐私。
        如果你认为是**安全问题**（泄露密钥、可被利用的脚本），请不要在这里提，见 SECURITY.md。
        如果你认为是**交易规则本身有问题**，请改用"规则讨论"模板。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 期望的行为 vs 实际的行为
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 最好是能在合成数据上复现（`python3 tests/test_pipeline_synthetic.py` 的做法）；否则请写清命令与参数
      placeholder: |
        1. export V51_HOME=...
        2. python3 scripts/...
        3. ...
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: python3 tests/run_all.py 的输出
      render: text
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: "Python 3.11 / macOS 14 / pandas 2.2 / numpy 1.26"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及哪一块
      options: [引擎, 实时扫描与账本, 档位, 日线数据, 30分钟数据, 池文件与pool_tool, 质地榜, 定时任务模板, TRIN, 文档, 测试, 其它]
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我没有在这个 Issue 里贴密钥、行情数据、账本或真实持仓
          required: true
        - label: 我已阅读 DISCLAIMER.md，明白这是研究与模拟工具，不构成投资建议
          required: true
