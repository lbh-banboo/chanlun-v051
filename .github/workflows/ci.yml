name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          # 不启用 cache: pip：该选项需要 requirements.txt / pyproject.toml
          # 计算缓存键；本仓库的依赖版本约束直接写在下面的 pip install 里，
          # 启用会让 setup-python 直接失败并跳过全部测试（CI #1 实测）。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.24,<2.5" "pandas>=2.0,<2.4"
      - name: Run all offline self-tests
        # 不联网、不依赖任何行情文件：合成数据 + 引擎截断/黄金快照/边界 + TRIN + 端到端 + 仓库自检（含脱敏扫描）
        run: python tests/run_all.py

  hygiene-strict:
    name: repo hygiene (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Strict hygiene (warnings fail)
        run: |
          pip install "numpy>=1.24,<2.5" "pandas>=2.0,<2.4"
          python tests/test_repo_hygiene.py --strict

  skill-spec:
    name: SKILL.md spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate frontmatter and name/dir match
        run: |
          python - <<'PY'
          import re, os, sys
          d = "skills/chanlun-v051"
          t = open(os.path.join(d, "SKILL.md"), encoding="utf-8").read()
          m = re.match(r"---\n(.*?)\n---\n", t, re.S)
          assert m, "missing frontmatter"
          fm = m.group(1)
          name = re.search(r"^name: (.*)$", fm, re.M).group(1).strip()
          desc = re.search(r"^description: (.*)$", fm, re.M).group(1)
          assert name == os.path.basename(d), (name, d)
          assert re.fullmatch(r"[a-z0-9]+(-[a-z0-9]+)*", name) and len(name) <= 64, name
          assert 1 <= len(desc) <= 1024, len(desc)
          print("SKILL.md ok:", name, len(desc), "chars")
          PY
